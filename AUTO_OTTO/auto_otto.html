<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Otto</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auto_otto.css">
</head>
<body>

<a href="../" class="back">◂ Back</a>

<img id="npc" src="sprites/otto_reg.png" alt="Talk to the character">
<div id="npc-box">
  <div id="npc-text"></div>
  <div id="npc-choices"></div>
</div>

<button id="spawn-apple">Spawn apple</button>
<div id="apple-count" hidden>Apples: <span id="apple-num">0</span></div>

<aside id="shop" class="closed" hidden>
  <div id="shop-panel">
    <h2>Shop</h2>
    <button id="buy-tree" class="shop-item" disabled>
  <img src="sprites/tree.png" alt="">
  <span>Apple tree<small id="tree-price">30 apples</small></span>
</button>
  </div>
  <button id="shop-toggle" aria-expanded="false" aria-label="Open shop">▸</button>
</aside>

<script src="auto_otto.js"></script>
<script src="../version.js"></script>

</body>
</html>
