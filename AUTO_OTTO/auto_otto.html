<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  #npc {
    position: fixed;
    left: 50px;
    bottom: 50px;
    height: 150px;
    cursor: pointer;
    image-rendering: pixelated;
    z-index: 1000;
  }
  #npc-box {
    display: none;
    position: fixed;
    left: 250px;
    bottom: 250px;
    width: min(360px, calc(100vw - 40px));
    background: #f2e8cf;
    color: #1c1c28;
    border: 4px solid #1c1c28;
    box-shadow: 4px 4px 0 #1c1c28;
    padding: 10px 14px;
    font: 24px/1.15 "VT323", "Courier New", monospace;
    z-index: 1000;
  }
  #npc-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  #npc-choices button {
    font: inherit; background: #1c1c28; color: #f2e8cf;
    border: none; padding: 2px 10px; cursor: pointer;
  }
  #npc-choices button:hover { background: #e0a526; color: #1c1c28; }

#spawn-apple {
  position: fixed;
  top: 8px;
  right: 10px;
  z-index: 1500;
  font: 22px "VT323", "Courier New", monospace;
  background: #f2e8cf;
  color: #1c1c28;
  border: 4px solid #1c1c28;
  box-shadow: 4px 4px 0 #1c1c28;
  padding: 2px 12px;
  cursor: pointer;
}
#spawn-apple:hover { background: #e0a526; }
#spawn-apple:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1c1c28; }

.apple {
  position: fixed;
  width: 48px;
  image-rendering: pixelated;
  z-index: 500;
  cursor: grab;
  touch-action: none;
  user-select: none;
}

</style>

<img id="npc" src="sprites/otto_reg.png" alt="Talk to the character">
<div id="npc-box">
  <div id="npc-text"></div>
  <div id="npc-choices"></div>
</div>

<a href="../" style="position:absolute;top:8px;left:10px;color:#000000;font-size:22px;">◂ Back</a>

<button id="spawn-apple">Spawn apple</button>

<script>
(() => {
  const SPRITES = ["sprites/otto_reg.png", "sprites/otto_openmouth.png"];
  const TALK_SPEED = 30, MOUTH_SPEED = 120;

  const story = {
    start: {
      lines: ["Stop touching me.", "Hey! Knock it off.", "Please stop."],
    },
    fed: {
    lines: ["*munch*", "Yummy."],
  }
  };

  const img = document.getElementById("npc");
  const box = document.getElementById("npc-box");
  const textEl = document.getElementById("npc-text");
  const choicesEl = document.getElementById("npc-choices");
  SPRITES.forEach(s => { new Image().src = s; });

  let node, idx, typing = false, fullLine = "", typeT, mouthT;

let hideT;
const HIDE_AFTER = 5000; // 5 seconds

function hide() {
  clearTimeout(hideT);
  clearInterval(typeT); clearInterval(mouthT);
  typing = false;
  img.src = SPRITES[0];
  box.style.display = "none";
}

function resetHide() {
  clearTimeout(hideT);
  hideT = setTimeout(hide, HIDE_AFTER);
}

function goTo(id) {
  if (!id) { hide(); return; }
  node = story[id]; idx = 0;
  box.style.display = "block";
  resetHide();
  showLine();
}

  function showLine() {
    choicesEl.innerHTML = "";
    fullLine = node.lines[idx];
    textEl.textContent = "";
    typing = true;
    let i = 0, f = 0;
    mouthT = setInterval(() => { img.src = SPRITES[++f % 2]; }, MOUTH_SPEED);
    typeT = setInterval(() => {
      textEl.textContent += fullLine[i++];
      if (i >= fullLine.length) finish();
    }, TALK_SPEED);
  }

  function finish() {
    clearInterval(typeT); clearInterval(mouthT);
    img.src = SPRITES[0];
    textEl.textContent = fullLine;
    typing = false;
    if (idx === node.lines.length - 1 && node.choices) {
      node.choices.forEach(c => {
        const b = document.createElement("button");
        b.textContent = c.text;
        b.onclick = e => { e.stopPropagation(); goTo(c.go); };
        choicesEl.appendChild(b);
      });
    }
  }

let dragging = false, moved = false, startX, startY;
img.addEventListener("pointerdown", e => {
  e.preventDefault();
  dragging = true; moved = false;
  startX = e.clientX; startY = e.clientY;
  img.style.transition = "none";
  img.setPointerCapture(e.pointerId);
});
img.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
  img.style.transform = `translate(${dx}px, ${dy}px)`;
});
img.addEventListener("pointerup", () => {
  dragging = false;
  img.style.transition = "transform 0.6s ease-out";
  img.style.transform = "";
});

img.addEventListener("click", () => {
  if (moved) return;
  if (box.style.display !== "block") { goTo("start"); return; }
  resetHide();
  if (typing) { finish(); return; }
  idx = (idx + 1) % node.lines.length;   // after the last line, wraps back to 0
  showLine();
});

const APPLE_SIZE = 48;

function feed() { goTo("fed"); }

function makeDraggable(apple) {
  let offX, offY;

  apple.addEventListener("pointerdown", e => {
    e.preventDefault();
    const r = apple.getBoundingClientRect();
    offX = e.clientX - r.left;
    offY = e.clientY - r.top;
    apple.style.zIndex = 1200;          // float above Otto while dragging
    apple.style.cursor = "grabbing";
    apple.setPointerCapture(e.pointerId);
  });

  apple.addEventListener("pointermove", e => {
    if (!apple.hasPointerCapture(e.pointerId)) return;
    const x = e.clientX - offX, y = e.clientY - offY;
    apple.style.left = Math.max(0, Math.min(x, window.innerWidth - APPLE_SIZE)) + "px";
    apple.style.top  = Math.max(0, Math.min(y, window.innerHeight - APPLE_SIZE)) + "px";
  });

  apple.addEventListener("pointerup", () => {
    apple.style.zIndex = "";
    apple.style.cursor = "";
    const a = apple.getBoundingClientRect();
    const o = img.getBoundingClientRect();
    const cx = a.left + a.width / 2, cy = a.top + a.height / 2;
    if (cx > o.left && cx < o.right && cy > o.top && cy < o.bottom) {
      apple.remove();
      feed();
    }
  });
}

document.getElementById("spawn-apple").addEventListener("click", () => {
  const apple = document.createElement("img");
  apple.src = "sprites/apple.png";
  apple.alt = "";
  apple.className = "apple";
  apple.style.left = Math.random() * (window.innerWidth - APPLE_SIZE) + "px";
  apple.style.top = Math.random() * (window.innerHeight - APPLE_SIZE) + "px";
  document.body.appendChild(apple);
  makeDraggable(apple);
});

})();
</script>

<script src="../version.js"></script>
